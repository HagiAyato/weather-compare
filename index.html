<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-185637831-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'UA-185637831-1');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Model Weather Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<script src="https://cdn.geolonia.com/community-geocoder.js"></script>

<body class="bg-gray-100 p-8">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">天気予報モデル比較</h1>

        <div class="flex flex-wrap gap-2 mb-6">
            <input type="text" id="locationInput" placeholder="郵便番号(1000001) or 緯度,経度 or 住所"
                class="flex-1 border p-2 rounded">
            <button onclick="fillAddressFromBrowserLocation()"
                class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700">
                現在地から入力
            </button>
            <button onclick="fetchWeather()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                取得
            </button>
        </div>

        <div id="result" class="space-y-4">
        </div>
    </div>
    <script src="script.js"></script>
</body>

<footer class="bg-gray-100 p-8">
    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h3 class="text-xl font-semibold">リンク</h3>
        <h4 class="text-lg font-medium">製作者関係</h4>
        <a href="https://hagiayato.github.io/my-site/" class="text-blue-600 underline"> 製作者のサイト "HA Works"</a><br />
        <a href="https://github.com/HagiAyato/weather-compare" class="text-blue-600 underline">
            このwebアプリのソースコード(github)</a><br />
    </div>
</footer>

</html>
